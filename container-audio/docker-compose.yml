services:
  deepfake-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_ID=Bgeorge/deepfake-audio-detector-wav2vec2
      - USE_LOCAL_WEIGHTS=false
    volumes:
      - ./hf-cache:/home/appuser/.cache/huggingface
      - ./fine_tuned_deepfake_detector:/models/fine_tuned:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  deepfake-api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_ID=Bgeorge/deepfake-audio-detector-wav2vec2
      - USE_LOCAL_WEIGHTS=false
    volumes:
      - ./hf-cache:/home/appuser/.cache/huggingface
      - ./fine_tuned_deepfake_detector:/models/fine_tuned:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
